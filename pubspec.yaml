name: gg
description: gg applies shell commands to multiple dart and flutter packages at once.
version: 11.0.1
publish_to: none
repository: https://github.com/ggsuite/gg.git

environment:
  sdk: ">=3.8.1<4.0.0"

dependencies:
  args: 2.7.0
  gg_one:
    path: ../gg_one # 11.0.0
  gg_args:
    path: ../gg_args # 2.0.4
  gg_console_colors:
    path: ../gg_console_colors # 2.1.5
  gg_local_package_dependencies:
    path: ../gg_local_package_dependencies # 1.4.0
  gg_log:
    path: ../gg_log # 1.0.6
  gg_process:
    path: ../gg_process # 1.1.6
  gg_project_root:
    path: ../gg_project_root # 1.0.4
  gg_status_printer:
    path: ../gg_status_printer # 1.1.4
  mocktail: 1.0.5
  path: 1.9.1
  pub_semver: 2.2.0
  pubspec_parse: 1.5.0
  yaml_edit: 2.2.4
  gg_multi:
    path: ../gg_multi # 5.10.0
dev_dependencies:
  fake_async: 1.3.3
  gg_capture_print:
    path: ../gg_capture_print # 1.0.9
  lints: 6.1.0
